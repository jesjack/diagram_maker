<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Diagrama</title>
<style>
  :root {
    --bg: #f4f5f7;
    --dot: #d5d8de;
    --panel: #ffffff;
    --panel-translucent: rgba(255, 255, 255, .5);
    --border: #d0d4db;
    --text: #1f2328;
    --muted: #656d76;
    --danger: #cf222e;
    --danger-bg: #ffebe9;
    --warn-bg: #fff8c5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    cursor: grab;
    touch-action: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px);
  }
  #stage.dragging { cursor: grabbing; }
  #canvas {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    user-select: none;
  }
  #canvas svg { position: relative; display: block; overflow: visible; }
  #canvas .shadow { position: absolute; top: 0; left: 0; pointer-events: none; }
  #canvas.no-ids .ids { display: none; }
  .toolbar button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }

  .toolbar {
    position: fixed;
    top: 12px;
    right: 12px;
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px;
    background: var(--panel-translucent);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    z-index: 10;
  }
  .toolbar button {
    min-width: 32px;
    height: 32px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  .toolbar button:hover { background: rgba(0, 0, 0, .06); }
  .toolbar, #warnings { touch-action: manipulation; }
  .toolbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
  #status { min-width: 48px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }

  #warnings {
    position: fixed;
    left: 12px;
    bottom: 12px;
    max-width: min(560px, calc(100vw - 24px));
    padding: 8px 12px;
    background: var(--warn-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    white-space: pre-wrap;
    z-index: 10;
  }

  #error {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 24px 16px;
    background: var(--bg);
    z-index: 20;
  }
  /* Pantallas táctiles y estrechas: botones más grandes y barra respetando la zona segura. */
  @media (pointer: coarse) {
    .toolbar button { min-width: 40px; height: 40px; }
    .toolbar button:hover { background: transparent; }
    .toolbar button:active { background: rgba(0, 0, 0, .06); }
  }
  @media (max-width: 480px) {
    .toolbar {
      top: auto;
      right: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(50%);
    }
    #warnings {
      top: max(12px, env(safe-area-inset-top));
      bottom: auto;
      left: 12px;
      max-height: 30vh;
      overflow: auto;
    }
  }

  #error[hidden], #warnings[hidden] { display: none; }
  #error .message {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 16px;
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 8px;
    font-weight: 600;
  }
  #error .source {
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    overflow: auto;
    padding: 8px 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #error .line { padding: 0 16px 0 0; white-space: pre; }
  #error .line::before {
    content: attr(data-n);
    display: inline-block;
    width: 48px;
    padding-right: 12px;
    text-align: right;
    color: var(--muted);
  }
  #error .line.bad { background: var(--danger-bg); }
  #error .line.bad::before { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<div id="stage">
  <div id="canvas"></div>
</div>

<div class="toolbar">
  <button id="btn-zoom-out" title="Alejar (-)">−</button>
  <span id="status">100%</span>
  <button id="btn-zoom-in" title="Acercar (+)">+</button>
  <button id="btn-fit" title="Ajustar a la pantalla (0, doble clic o doble toque)">Ajustar</button>
  <button id="btn-ids" title="Mostrar u ocultar el id de cada nodo (i)" aria-pressed="true">ID</button>
  <span class="sep"></span>
  <button id="btn-svg" title="Descargar como SVG">SVG</button>
  <button id="btn-png" title="Descargar como PNG">PNG</button>
</div>

<div id="warnings" hidden></div>

<div id="error" hidden>
  <div class="message"></div>
  <div class="source"></div>
</div>

<script type="application/json" id="diagram-source">__DIAGRAM_SOURCE__</script>
<script>
__DIAGRAM_SCRIPTS__
</script>
<script>
  DiagramViewer.start({
    source: JSON.parse(document.getElementById("diagram-source").textContent),
    title: __DIAGRAM_TITLE__,
  });
</script>
</body>
</html>
